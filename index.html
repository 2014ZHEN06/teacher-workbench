<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>物理教师工作台</title>
<style>
:root{
  --primary:#2563eb; --primary-light:#eff6ff;
  --bg:#f1f5f9; --card:#ffffff; --border:#e2e8f0;
  --text:#0f172a; --muted:#64748b;
  --green:#16a34a; --green-bg:#f0fdf4;
  --amber:#b45309; --amber-bg:#fffbeb;
  --red:#dc2626; --red-bg:#fef2f2;
  --gray-bg:#f8fafc;
  --radius:12px; --shadow:0 1px 3px rgba(15,23,42,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.6}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font:inherit;color:var(--text)}

/* ---------- 头部导航 ---------- */
header{position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid var(--border);box-shadow:var(--shadow)}
.hbar{max-width:1280px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{font-weight:700;font-size:17px}
nav{display:flex;gap:4px;overflow-x:auto;margin-left:auto}
nav button{padding:8px 14px;border-radius:8px;color:var(--muted);white-space:nowrap;font-weight:500}
nav button.active{background:var(--primary-light);color:var(--primary);font-weight:600}
main{max-width:1280px;margin:0 auto;padding:20px 16px 70px}
@media(max-width:720px){
  .hbar{flex-direction:column;align-items:stretch;gap:8px}
  nav{margin-left:0}
  nav button{flex:1;text-align:center;padding:8px 6px}
}

/* ---------- 通用组件 ---------- */
.btn{display:inline-flex;align-items:center;gap:5px;padding:7px 14px;border-radius:8px;font-weight:500;background:#fff;border:1px solid var(--border);color:var(--text);white-space:nowrap}
.btn:hover{background:var(--gray-bg);border-color:#cbd5e1}
.btn-primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn-primary:hover{background:#1d4ed8;border-color:#1d4ed8}
.btn-danger{color:var(--red);border-color:#fecaca}
.btn-danger:hover{background:var(--red-bg);border-color:#fca5a5}
.btn-sm{padding:3px 9px;font-size:12px;border-radius:6px}
.btn-link{color:var(--primary);font-size:12px;padding:2px 4px}
.btn-link:hover{text-decoration:underline}
.sub{color:var(--muted);font-size:12px}
.sec{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 12px;flex-wrap:wrap}
.sec h2{font-size:16px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.badge{display:inline-block;padding:1px 8px;border-radius:99px;font-size:11px;font-weight:600;white-space:nowrap}
.b-green{background:var(--green-bg);color:var(--green)}
.b-amber{background:var(--amber-bg);color:var(--amber)}
.b-red{background:var(--red-bg);color:var(--red)}
.b-gray{background:var(--gray-bg);color:var(--muted);border:1px solid var(--border)}
.empty{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:34px 20px;text-align:center;color:var(--muted)}
.demo-tip{background:var(--amber-bg);border:1px solid #fde68a;color:#92400e;border-radius:10px;padding:10px 14px;margin-bottom:16px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-size:13px}

/* ---------- 统计卡 ---------- */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.stat{background:var(--card);border-radius:var(--radius);padding:12px 16px;box-shadow:var(--shadow)}
.stat span{color:var(--muted);font-size:12px}
.stat b{display:block;font-size:24px;line-height:1.4}
.stat b.warn{color:var(--amber)}
@media(max-width:720px){.stats{grid-template-columns:repeat(2,1fr)}}

/* ---------- 双栏 ---------- */
.cols{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
@media(max-width:720px){.cols{grid-template-columns:1fr}}
.panel{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 16px}
.item{padding:10px 2px;border-top:1px solid var(--border)}
.item:first-of-type{border-top:none}

/* ---------- 列表（表格） ---------- */
.list{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.lrow{display:grid;grid-template-columns:1fr 1.1fr .6fr 1fr .8fr 1.1fr .7fr 1.4fr 210px;gap:10px;align-items:center;padding:10px 14px;border-top:1px solid var(--border)}
.lrow.head{border-top:none;background:var(--gray-bg);color:var(--muted);font-size:12px;font-weight:600}
.lrow .cell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow .cell.strong{font-weight:600}
.cell.op{display:flex;gap:6px;flex-wrap:wrap}
.lrow .stu-ck{margin-right:6px;vertical-align:-1px;cursor:pointer}
.ck-lb{display:flex;align-items:center;gap:6px;cursor:pointer;font-weight:inherit}
.bulkbar{display:none;align-items:center;gap:12px;padding:9px 14px;margin-top:10px;background:var(--primary-light);border-radius:10px;font-size:13px}
.bulkbar.show{display:flex}
.lrow.editing{grid-template-columns:1fr 82px 100px 1.2fr 76px 100px 112px 84px 1.3fr 44px}
.lrow.editing .cell input,.lrow.editing .cell select{width:100%;min-width:0;border:1px solid var(--border);border-radius:6px;padding:5px 7px;font-size:13px;background:#fff;font-family:inherit}
@media(max-width:820px){
  .lrow{display:block;padding:12px 14px}
  .lrow.head{display:none}
  .lrow+.lrow{border-top:1px solid var(--border);margin-top:8px;padding-top:12px}
  .cell{display:flex;justify-content:space-between;gap:12px;padding:2px 0}
  .cell::before{content:attr(data-label);color:var(--muted);font-size:12px;flex-shrink:0}
  .cell.op{flex-wrap:wrap;justify-content:flex-end;gap:6px;margin-top:6px}
  .cell.op::before{content:none}
}
.filterbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.filterbar select,.filterbar input{padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:#fff}
.filterbar input{flex:1;min-width:160px}

/* ---------- 周视图课表 ---------- */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:10px}
@media(max-width:1200px){.week{grid-template-columns:repeat(auto-fill,minmax(175px,1fr))}}
.daycol{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:10px;min-height:230px}
.slotblk{min-height:180px;display:flex;flex-direction:column;border-top:1px dashed var(--border);padding:3px 0 5px}
.slotblk:first-of-type{border-top:none;padding-top:0}
.slotblk.free{min-height:0}
.slot-h{font-size:10px;color:#94a3b8;font-weight:700;margin-bottom:3px;letter-spacing:.5px;flex-shrink:0}
.slotblk .mini{flex:1;margin-bottom:2px}
.slot-empty{flex:1}
.mc-line{display:flex;gap:4px;align-items:center;flex-wrap:wrap;margin-top:2px}
.daycol.today{outline:2px solid var(--primary);outline-offset:-2px}
.day-h{font-weight:600;margin-bottom:8px;font-size:13px;display:flex;justify-content:space-between;align-items:baseline;gap:4px}
.mini{background:var(--primary-light);border-radius:8px;padding:8px;margin-bottom:8px;font-size:12px}
.mini.dim{opacity:.55}
.mini .mc-t{font-weight:700}
.mini .mc-c{color:var(--primary);font-weight:600}
.mini .mc-topic{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mc-btns{display:flex;gap:3px;flex-wrap:wrap;margin-top:5px}
.mc-btns .btn-sm{padding:2px 6px;font-size:11px}

/* ---------- 反馈列表 ---------- */
.fb-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:12px 14px;margin-bottom:10px}
.clamp{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- 表单与模态 ---------- */
.form{display:grid;gap:12px}
.fi label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;font-weight:600}
.fi input,.fi select,.fi textarea{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:8px;background:#fff}
.fi input:focus,.fi select:focus,.fi textarea:focus{outline:2px solid var(--primary-light);border-color:var(--primary)}
.fi textarea{min-height:68px;resize:vertical}
.fi input[readonly]{background:var(--gray-bg);color:var(--muted)}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:560px){.frow{grid-template-columns:1fr}}
.m-actions{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin-top:4px}
#modal-root{display:none}
#modal-root.show{display:block}
.mask{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:#fff;border-radius:14px;width:100%;max-width:580px;max-height:88vh;display:flex;flex-direction:column;box-shadow:0 10px 40px rgba(15,23,42,.25)}
.modal-lg{max-width:940px;max-height:92vh}
.m-head{display:flex;justify-content:space-between;align-items:center;padding:13px 18px;border-bottom:1px solid var(--border);flex-shrink:0}
.m-head h3{font-size:15px}
.m-x{font-size:15px;color:var(--muted);padding:2px 8px}
.m-body{padding:18px;overflow-y:auto}
.m-body+.m-body{border-top:none}
.cls-row{display:flex;align-items:center;gap:10px;padding:9px 2px;border-top:1px solid var(--border);flex-wrap:wrap}
.cls-row>span:first-child{font-weight:600}
.cls-row .grow{flex:1}
.ps-item{border:1px solid var(--border);border-radius:8px;padding:8px;margin-bottom:8px;background:var(--gray-bg)}
.ps-name{display:flex;align-items:center;gap:8px;font-weight:600;margin-bottom:6px}
.ps-name .btn-link{margin-left:auto}
.ps-item textarea{width:100%;min-height:52px;border:1px solid var(--border);border-radius:6px;padding:6px 8px;background:#fff;resize:vertical}
.psb{background:#fff;padding:12px 14px;border:1px solid var(--border);border-radius:10px;white-space:pre-wrap;font-size:13px;margin-top:8px}

/* ---------- 考勤 / 常用语 / 待办 / 档案 ---------- */
.att-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--border);flex-wrap:wrap}
.att-row:first-of-type{border-top:none}
.att-name{font-weight:600;display:flex;align-items:center;gap:6px}
.att-btns{display:flex;gap:6px}
.att-btn{padding:4px 13px;border-radius:99px;border:1px solid var(--border);font-size:12px;background:#fff}
.att-btn.on-present{background:var(--green-bg);border-color:var(--green);color:var(--green);font-weight:600}
.att-btn.on-leave{background:var(--amber-bg);border-color:var(--amber);color:var(--amber);font-weight:600}
.att-btn.on-absent{background:var(--red-bg);border-color:var(--red);color:var(--red);font-weight:600}
.phrase-bar{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{padding:3px 10px;border-radius:99px;border:1px solid var(--border);background:#fff;font-size:12px}
.chip:hover{border-color:var(--primary);color:var(--primary)}
.todo-add{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.todo-add input{padding:8px 10px;border:1px solid var(--border);border-radius:8px}
.todo-add input[type=text]{flex:1;min-width:180px}
.todo-item{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--border)}
.todo-item:first-of-type{border-top:none}
.todo-check{width:19px;height:19px;border:2px solid var(--primary);border-radius:5px;flex-shrink:0;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:12px;line-height:1}
.todo-item.done .todo-check{background:var(--primary)}
.todo-item.done .todo-text{color:var(--muted);text-decoration:line-through}
.todo-text{flex:1}
.todo-overdue{color:var(--red)}
.name-link{cursor:pointer;border-bottom:1px dashed var(--muted)}
.name-link:hover{color:var(--primary);border-bottom-color:var(--primary)}
.arc-sec{margin-top:14px}
.arc-sec h4{font-size:13px;color:var(--muted);margin-bottom:6px;font-weight:600}

/* ---------- 学期与月视图 ---------- */
.seg{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.seg button{padding:6px 12px;font-size:13px;background:#fff;color:var(--muted)}
.seg button.on{background:var(--primary);color:#fff;font-weight:600}
.mhead{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:6px;text-align:center;font-size:12px;color:var(--muted);font-weight:600}
.month{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.mcell{background:var(--card);border-radius:10px;box-shadow:var(--shadow);min-height:88px;padding:6px;cursor:pointer;border:1px solid transparent}
.mcell:hover{border-color:var(--primary)}
.mcell.out{opacity:.45}
.mcell.today{border-color:var(--primary);box-shadow:0 0 0 1px var(--primary)}
.mc-d{font-weight:700;font-size:13px;margin-bottom:4px}
.mcl{font-size:11px;background:var(--primary-light);border-radius:5px;padding:2px 5px;margin-bottom:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mcl.more{background:var(--gray-bg);color:var(--muted)}
@media(max-width:720px){.month{gap:3px}.mhead{gap:3px}.mcell{min-height:60px;padding:4px}.mc-d{font-size:11px}.mcl{font-size:10px;padding:1px 3px}}
.term-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--border);flex-wrap:wrap;font-size:13px}
.term-row:first-of-type{border-top:none}
.term-row .tn{font-weight:600;min-width:120px}
.term-row .tn2{color:var(--muted);font-size:12px}
.tbar{flex:1;min-width:80px;height:8px;background:var(--gray-bg);border-radius:99px;overflow:hidden}
.tbar i{display:block;height:100%;border-radius:99px}
.stat b .unit{font-size:12px;color:var(--muted);font-style:normal;font-weight:500;margin-left:2px}

.att-btn.on-video{background:#eff6ff;border-color:#1d4ed8;color:#1d4ed8;font-weight:600}
.kp-row{border-top:1px solid var(--border);padding:8px 2px}
.kp-row:first-child{border-top:none}
.kp-row summary{display:flex;align-items:center;gap:10px;cursor:pointer;flex-wrap:wrap}
.kp-row summary b{min-width:110px}
.kp-row summary .sub{margin-left:auto}
.alertbar{background:#fffbeb;border:1px solid #fcd34d;border-radius:10px;padding:10px 14px;font-size:13px;margin-bottom:14px;display:flex;flex-direction:column;gap:6px;line-height:1.6}
.att-extra{margin-top:10px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.att-extra select{padding:5px 8px;border:1px solid var(--border);border-radius:8px;max-width:230px;background:#fff}
#att-extra-q{padding:5px 8px;border:1px solid var(--border);border-radius:8px;width:170px;background:#fff;font-family:inherit;font-size:13px}
.sug{position:absolute;top:100%;left:0;z-index:40;background:#fff;border:1px solid var(--border);border-radius:8px;box-shadow:var(--shadow);min-width:200px;max-height:210px;overflow-y:auto;display:none}
.sug-item{padding:7px 10px;cursor:pointer;display:flex;justify-content:space-between;gap:10px;font-size:13px;align-items:center}
.sug-item:hover{background:var(--primary-light)}
.badge.b-blue{background:#eff6ff;color:#1d4ed8}
.att-cell{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:6px;font-size:12px;font-weight:700;margin:0 3px 4px 0}
.att-c-present{background:var(--green-bg);color:var(--green)}
.att-c-video{background:#eff6ff;color:#1d4ed8}
.att-c-leave{background:var(--red-bg);color:var(--red)}
.att-c-none{background:var(--gray-bg);color:#94a3b8}
.att-c-makeup{background:var(--green-bg);color:var(--green)}
.att-c-trial{background:#f5f3ff;color:#8b5cf6}
.mk-sel{max-width:160px;padding:3px 6px;border:1px solid var(--border);border-radius:6px;font-size:12px;background:#fff;color:var(--muted)}
.att-c-future{background:var(--gray-bg);color:#cbd5e1;font-weight:400}
.arc-g{margin-bottom:10px}
.arc-g-h{font-weight:600;font-size:13px;margin-bottom:4px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cbx-list{display:flex;flex-wrap:wrap;gap:6px}
.gg-row{display:flex;align-items:center;gap:8px;padding:3px 0;flex-wrap:wrap}
.gg-label{font-weight:700;font-size:12px;min-width:34px}
.gg-chips{display:flex;flex-wrap:wrap;gap:6px}
.cbx{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border:1px solid var(--border);border-radius:8px;cursor:pointer;background:#fff;font-size:13px}
.cbx input{accent-color:var(--primary)}

/* ---------- 小测 ---------- */
.qe-row{display:flex;align-items:flex-start;gap:8px;padding:8px 0;border-top:1px solid var(--border);flex-wrap:wrap}
.qe-row:first-of-type{border-top:none}
.qe-name{font-weight:600;min-width:64px;padding-top:3px}
.qe-nums{display:flex;flex-wrap:wrap;gap:3px;flex:1;min-width:160px;padding-top:1px}
.num-btn{width:26px;height:26px;border:1px solid var(--border);border-radius:6px;background:#fff;font-size:12px;display:inline-flex;align-items:center;justify-content:center;padding:0}
.num-btn.on{background:var(--red-bg);border-color:#fca5a5;color:var(--red);font-weight:700}
.num-btn.dis{opacity:.35;pointer-events:none}
.qe-side{display:flex;align-items:center;gap:6px}
.qe-input{width:110px;padding:5px 8px;border:1px solid var(--border);border-radius:8px;font-size:12px}
.qg-ta{width:100%;min-height:60px;border:1px solid var(--border);border-radius:6px;padding:6px 8px;background:#fff;resize:vertical;font:inherit}
.hw-sel{margin-top:4px;font-size:12px;padding:4px 8px;border:1px solid var(--border);border-radius:6px;background:#fff;max-width:100%}

.kw-line{display:flex;align-items:flex-start;gap:6px;margin-top:6px;flex-wrap:wrap}
.kw-label{font-size:12px;color:var(--muted);flex-shrink:0;padding-top:3px}
.kw-chips{display:flex;flex-wrap:wrap;gap:4px}
.kw-chip{padding:2px 9px;border-radius:99px;border:1px solid var(--border);background:#fff;font-size:12px}
.kw-chip.on-good{background:var(--green-bg);border-color:#86efac;color:var(--green);font-weight:600}
.kw-chip.on-bad{background:var(--amber-bg);border-color:#fcd34d;color:var(--amber);font-weight:600}
.ps-meta2{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}

.billbar{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:10px 14px;margin-top:10px;font-size:13px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.billbar b{color:var(--amber);font-size:17px}

/* ---------- Toast ---------- */
#toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(16px);background:#0f172a;color:#fff;padding:9px 18px;border-radius:99px;opacity:0;pointer-events:none;transition:.25s;z-index:300;max-width:90vw}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<header>
  <div class="hbar">
    <div class="brand">⚛️ 物理教师工作台</div>
    <nav>
      <button data-page="dashboard" class="active" onclick="switchPage('dashboard')">🏠 总览</button>
      <button data-page="students" onclick="switchPage('students')">👥 学员</button>
      <button data-page="schedule" onclick="switchPage('schedule')">📅 课表</button>
      <button data-page="feedback" onclick="switchPage('feedback')">✍️ 反馈</button>
      <button data-page="quiz" onclick="switchPage('quiz')">🧪 小测</button>
    </nav>
  </div>
</header>
<main id="app"></main>
<div id="modal-root"></div>
<div id="toast"></div>

<script>
'use strict';
/* ================= 常量与工具 ================= */
const KEY='ptw_v1';
const GRADES=['初二','初三','高一','高二','高三'];
const WEEK_CN=['周一','周二','周三','周四','周五','周六','周日'];
const WD_CN='日一二三四五六';
const SEASONS={
  spring:{icon:'🌸',label:'春季',color:'#be185d',bg:'#fdf2f8'},
  summer:{icon:'☀️',label:'暑假',color:'#c2410c',bg:'#fff7ed'},
  autumn:{icon:'🍂',label:'秋季',color:'#92400e',bg:'#fef3c7'},
  winter:{icon:'❄️',label:'寒假',color:'#1d4ed8',bg:'#eff6ff'}
};
const GRADE_COLORS={'初二':'#2563eb','初三':'#7c3aed','高一':'#0d9488','高二':'#d97706','高三':'#dc2626'};
function gradYearOf(grade){
  const d=new Date(),y=d.getFullYear(),m=d.getMonth()+1;
  const base=m>=9?y+1:y;

function generateCourseLessons(c){

  if(isDailySeason(c.season)){
    let d=parseDate(c.startDate);
    const rest=c.restDays||[];
    let guard=0;
    while(made<c.plannedHours&&guard++<500){
      const date=fmtDate(d);
      if(rest.indexOf(date)<0&&!db.lessons.some(l=>l.date===date&&l.start===c.slotStart&&l.classId===mainClass)){
        db.lessons.push({id:uid(),date,start:c.slotStart,end:c.slotEnd,classId:mainClass,room:c.slotRoom,topic:'',status:'normal',courseId:c.id});
        made++;last=date;
      }
      d=addDays(d,1);
    }
  }else{
    let d=parseDate(c.startDate);
    while((d.getDay()+6)%7!==c.slotDow)d=addDays(d,1);
    for(let i=0;i<c.plannedHours;i++){

      if(!db.lessons.some(l=>l.date===date&&l.start===c.slotStart&&l.classId===mainClass)){

        made++;last=date;
      }
      d=addDays(d,7);
    }
  }
  return{made,last};
}

async function readZipEntry(buf,entryName){
  const dv=new DataView(buf.buffer,buf.byteOffset,buf.byteLength);
  let eocd=-1;
  const min=Math.max(0,buf.length-66000);
  for(let i=buf.length-22;i>=min;i--){if(dv.getUint32(i,true)===0x06054b50){eocd=i;break}}
  if(eocd<0)throw new Error('无法识别该文件（不是有效的 xlsx/docx 压缩包）');
  const cdCount=dv.getUint16(eocd+10,true);
  let off=dv.getUint32(eocd+16,true);
  let target=null;
  for(let i=0;i<cdCount&&off+46<=buf.length;i++){
    if(dv.getUint32(off,true)!==0x02014b50)break;
    const method=dv.getUint16(off+10,true);
    const compSize=dv.getUint32(off+20,true);
    const nameLen=dv.getUint16(off+28,true);
    const extraLen=dv.getUint16(off+30,true);
    const cmtLen=dv.getUint16(off+32,true);
    const localOff=dv.getUint32(off+42,true);
    const name=new TextDecoder().decode(buf.subarray(off+46,off+46+nameLen));
    if(name===entryName){target={method,compSize,localOff};break}
    off+=46+nameLen+extraLen+cmtLen;
  }
  if(!target)throw new Error('文件中未找到：'+entryName);
  const lh=target.localOff;
  if(dv.getUint32(lh,true)!==0x04034b50)throw new Error('压缩包结构异常');
  const lNameLen=dv.getUint16(lh+26,true),lExtraLen=dv.getUint16(lh+28,true);
  const dataStart=lh+30+lNameLen+lExtraLen;
  const comp=target.compSize?buf.subarray(dataStart,dataStart+target.compSize):buf.subarray(dataStart);
  if(target.method===0)return comp;
  if(target.method===8){
    if(typeof DecompressionStream==='undefined')throw new Error('当前浏览器不支持解压，请改用最新版 Edge/Chrome');
    const ds=new DecompressionStream('deflate-raw');
    const ab=await new Response(new Blob([comp]).stream().pipeThrough(ds)).arrayBuffer();
    return new Uint8Array(ab);
  }
  throw new Error('不支持的压缩方式');
}
async function extractDocxText(file){
  const buf=new Uint8Array(await file.arrayBuffer());
  let xmlBytes;
  try{xmlBytes=await readZipEntry(buf,'word/document.xml')}
  catch(e){throw new Error('无法解析该文档。若是旧版 .doc，请先在 Word 中另存为 .docx 再上传（'+e.message+'）')}
  const xml=new TextDecoder().decode(xmlBytes);
  const paras=[];
  const pRe=/<w:p[\s>][\s\S]*?<\/w:p>/g;
  let m;
  while((m=pRe.exec(xml))){
    const tRe=/<w:t[^>]*>([\s\S]*?)<\/w:t>/g;
    let t,txts=[];
    while((t=tRe.exec(m[0])))txts.push(t[1]);
    if(!txts.length)continue;
    let line=txts.join('');
    line=line.replace(/&#x([0-9a-fA-F]+);/g,function(m,h){return String.fromCodePoint(parseInt(h,16))});
    line=line.replace(/&#(\d+);/g,function(m,d){return String.fromCodePoint(+d)});
    line=line.replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&apos;/g,"'").replace(/&amp;/g,'&');

  }

async function parseImportFile(file){
  const nm=(file.name||'').toLowerCase();
  if(nm.endsWith('.csv'))return parseCsv(await file.text());
  if(nm.endsWith('.xlsx'))return parseXlsx(file);

function rowsToStudents(rows){
  if(!rows||!rows.length)throw new Error('文件内容为空');
  const header=(rows[0]||[]).map(function(x){return String(x||'').trim()});
  const colIdx=function(){for(let i=0;i<arguments.length;i++){const j=header.indexOf(arguments[i]);if(j>=0)return j}return -1};
  const ci={name:colIdx('姓名'),grade:colIdx('年段'),cls:colIdx('班级'),school:colIdx('学校'),relation:colIdx('家长关系','关系','称谓'),phone:colIdx('联系电话','电话'),notes:colIdx('备注')};
  if(ci.name<0||ci.grade<0)throw new Error('表格缺少必需列「姓名」或「年段」（请使用下载的模板）');
  const out=[],errors=[];
  for(let r=1;r<rows.length;r++){
    const row=rows[r]||[];
    const nm=String(row[ci.name]||'').trim();
    if(!nm)continue;
    const grade=String(row[ci.grade]||'').trim();
    if(GRADES.indexOf(grade)<0){errors.push('第'+(r+1)+'行：年段「'+grade+'」无效（应为 初二/初三/高一/高二/高三）');continue}
    let classId=null;
    if(ci.cls>=0){
      const cn=String(row[ci.cls]||'').trim();
      if(cn){
        const c=db.classes.find(function(x){return x.grade===grade&&(x.name===cn||x.grade+x.name===cn)});
        if(c)classId=c.id;
      }
    }
    out.push({name:nm,grade:grade,classId:classId,school:ci.school>=0?String(row[ci.school]||'').trim():'',relation:ci.relation>=0?String(row[ci.relation]||'').trim():'',phone:ci.phone>=0?String(row[ci.phone]||'').trim():'',notes:ci.notes>=0?String(row[ci.notes]||'').trim():''});
  }
  return{students:out,errors:errors};
}

function goFeedback(lessonId){switchPage('feedback');openFbForm(lessonId)}
function monthData(sid,ym){
  const s=db.students.find(x=>x.id===sid);
  const mFrom=ym+'-01',mTo=ym+'-31';
  let present=0,video=0,leave=0;
  db.lessons.forEach(function(l){
    if(l.status==='cancelled'||l.date<mFrom||l.date>mTo)return;
    const a=(l.attendance||{})[sid];
    if(a==='present')present++;else if(a==='video')video++;else if(a==='leave'||a==='absent')leave++;
  });
  const fbs=db.feedbacks.filter(f=>f.date>=mFrom&&f.date<=mTo&&(f.perStudent||{})[sid]).sort((a,b)=>a.date.localeCompare(b.date));
  const grades=fbs.map(f=>(f.fbGrade||{})[sid]).filter(Boolean);
  const qs=db.quizzes.filter(q=>q.date>=mFrom&&q.date<=mTo&&q.results&&q.results[sid]&&!q.results[sid].absent);
  const kpCnt={};
  qs.forEach(function(q){
    (q.results[sid].wrong||[]).forEach(function(no){
      const p=(q.points||[]).filter(x=>x.no===no)[0];
      const key=p?p.point:('第'+no+'题');
      kpCnt[key]=(kpCnt[key]||0)+1;
    });
  });
  const kps=Object.keys(kpCnt).sort((a,b)=>kpCnt[b]-kpCnt[a]);
  return{s:s,present,video,leave,fbs,grades,quizN:qs.length,kps,kpCnt};
}
function buildMonthReport(sid,ym){
  const d=monthData(sid,ym);
  const a=ym.split('-');
  const L=['【学习月报 · '+d.s.name+'】'+a[0]+'年'+(+a[1])+'月'];
  L.push('出勤情况：出勤 '+d.present+' 次'+(d.video?(' · 补视频录课 '+d.video+' 次'):'')+(d.leave?(' · 请假 '+d.leave+' 次'):''));
  if(d.quizN)L.push('课堂检测：参加 '+d.quizN+' 次小测'+(d.grades.length?(' · 等级 '+d.grades.join(' → ')):''));
  else if(d.grades.length)L.push('课堂检测：等级 '+d.grades.join(' → '));
  if(d.kps.length)L.push('错题主题：'+d.kps.slice(0,4).map(k=>k+'（'+d.kpCnt[k]+' 题）').join('、'));
  return L.join('\n');
}

  const dataLines=['月份：'+a[0]+'年'+(+a[1])+'月',
    '出勤：出勤 '+d.present+' 次，补视频 '+d.video+' 次，请假 '+d.leave+' 次',

      {role:'system',content:'你是一位中学物理课外辅导老师，正在给一位学生的家长写月度学习总结。根据提供的数据写一段 60~100 字的评语：先肯定本月表现和进步，再委婉指出需要加强的地方，最后给一句鼓励或建议。语气自然温暖、像微信发给家长的话，不排名、不比较、不编造数据之外的信息，不用称呼开头。只输出这段评语文字。'},

function todoPanelHTML(){

function addTodo(e){
  e.preventDefault();
  const f=e.target.elements;
  const text=f.text.value.trim();
  if(!text)return false;
  db.todos.push({id:uid(),text,due:f.due.value||null,done:false,createdAt:Date.now()});
  save();renderPage();toast('已添加待办');return false;
}
function toggleTodo(id){
  const td=db.todos.find(x=>x.id===id);
  td.done=!td.done;
  save();renderPage();
}
function delTodo(id){
  db.todos=db.todos.filter(x=>x.id!==id);
  save();renderPage();
}
function clearDoneTodos(){
  if(!confirm('清除全部已完成待办？'))return;
  db.todos=db.todos.filter(x=>!x.done);
  save();renderPage();toast('已清除');
}

function saveMultiEdit(){

  rows.forEach(function(row){
    const s=db.students.find(x=>x.id===row.dataset.id);if(!s)return;
    const name=row.querySelector('.bk-name').value.trim();
    if(!name){empty=true;return}
    const cohortV=row.querySelector('.bk-cohort').value.trim();
    const relV=row.querySelector('.bk-rel').value;
    s.name=name;
    s.grade=row.querySelector('.bk-grade').value;
    s.classId=row.querySelector('.bk-cls').value||null;
    s.school=row.querySelector('.bk-school').value.trim();
    s.cohort=cohortV?+cohortV:null;
    s.relation=(relV&&relV!=='__new__')?relV:'';
    s.phone=row.querySelector('.bk-phone').value.trim();
    s.status=row.querySelector('.bk-st').value;
    s.notes=row.querySelector('.bk-notes').value.trim();
  });

  ui.stu.editMode=false;ui.stu.sel={};save();renderPage();
  toast('已保存 '+rows.length+' 名学员的修改');

function saveStudent(e,id,isTrialForm){
  e.preventDefault();
  const f=e.target.elements;
  const cur=id?db.students.find(x=>x.id===id):null;
  const trialMode=!!(isTrialForm||(cur&&cur.status==='trial'));
  const o={name:f.name.value.trim(),grade:f.grade.value,cohort:f.cohort&&f.cohort.value.trim()?+f.cohort.value.trim():null,school:f.school.value.trim(),relation:(f.relation.value&&f.relation.value!=='__new__')?f.relation.value.trim():'',phone:f.phone.value.trim(),notes:f.notes.value.trim(),joinedAt:(f.joinedAt&&f.joinedAt.value)||null};
  if(!o.name){toast('请填写姓名');return false}
  if(trialMode){
    if(!f.courseId.value){toast('请选择试听课程期');return false}
    o.trial={courseId:f.courseId.value,result:cur&&cur.trial?cur.trial.result:null,resolvedAt:cur&&cur.trial?cur.trial.resolvedAt:null};
    if(!id){o.status='trial';o.classId=null}
  }else{
    o.classId=f.classId.value||null;
    o.status=f.status.value;
  }
  if(id){Object.assign(db.students.find(x=>x.id===id),o);toast('已保存修改')}
  else{db.students.push(Object.assign({id:uid(),createdAt:Date.now()},o));toast(trialMode?'已加入试听学员':'已添加学员')}
  save();closeModal();renderPage();return false;
}
function openTrialResult(id){
  const s=db.students.find(x=>x.id===id);
  if(!s||s.status!=='trial')return;
  const c=s.trial&&s.trial.courseId?db.courses.find(x=>x.id===s.trial.courseId):null;
  const defCls=(c&&c.classIds&&c.classIds.length)?c.classIds[0]:'';
  showModal('试听结果 · '+esc(s.name),
    '<p class="sub" style="margin-bottom:8px">试听：'+(c?esc(c.name+' · '+courseClassNames(c)):'（未记录课程期）')+(s.joinedAt?' · '+dateCN(s.joinedAt)+' 起':'')+'</p>'
    +'<div class="form">'
    +'<div class="fi"><label>报名班级（成功报名时归入）</label><select id="tr-cls"><option value="">未选</option>'+db.classes.map(c2=>'<option value="'+c2.id+'"'+(c2.id===defCls?' selected':'')+'>'+esc(c2.grade+c2.name)+'</option>').join('')+'</select></div>'
    +'<p class="sub">✅ 成功报名：加入所选班级，试听课保持「试」不计费，从下一节课起正常计费。<br>✖ 未报名：此后课次不再出现他，档案保留试听记录。</p>'
    +'<div class="m-actions"><button type="button" class="btn btn-danger" onclick="trialFail(\''+id+'\')">✖ 未报名</button><span style="flex:1"></span><button type="button" class="btn" onclick="closeModal()">取消</button><button type="button" class="btn btn-primary" onclick="trialEnroll(\''+id+'\')">✅ 成功报名</button></div>'
    +'</div>');
}
function trialEnroll(id){
  const s=db.students.find(x=>x.id===id);
  const cls=$('#tr-cls').value;
  if(!cls){toast('请选择报名班级');return}
  s.classId=cls;s.status='active';
  if(!s.trial)s.trial={};
  s.trial.result='enrolled';s.trial.resolvedAt=Date.now();
  save();closeModal();renderPage();
  toast(s.name+' 已报名（'+clsNameById(cls)+'），下一节课起计费');
}
function trialFail(id){
  const s=db.students.find(x=>x.id===id);
  if(!confirm('确认 '+s.name+' 试听未报名？\n未报名后所有课次名册不再出现他，档案保留试听记录。'))return;
  s.status='trialed';
  if(!s.trial)s.trial={};
  s.trial.result='failed';s.trial.resolvedAt=Date.now();
  save();closeModal();renderPage();
  toast(s.name+' 已标记为「试听未报名」');
}

function delClass(id){
  const c=db.classes.find(x=>x.id===id);
  const n=db.students.filter(s=>s.classId===id).length;
  const msg=n?('「'+c.grade+c.name+'」中有 '+n+' 名学员，删除后这些学员将变为"未分班"。确定删除？'):('确定删除「'+c.grade+c.name+'」？');
  if(!confirm(msg))return;
  db.students.forEach(s=>{if(s.classId===id)s.classId=null});
  db.classes=db.classes.filter(x=>x.id!==id);
  save();openClassMgr();renderPage();toast('已删除班级');
}

function stuBadge(s){
  if(s.status==='active')return '<span class="badge b-green">在读</span>';
  if(s.status==='trial')return '<span class="badge b-blue">试听中</span>';
  if(s.status==='trialed')return '<span class="badge b-gray">试听未报名</span>';
  if(s.status==='graduated')return '<span class="badge" style="background:#eff6ff;color:#1d4ed8">毕业</span>';
  return '<span class="badge b-gray">停课</span>';
}
function promoteStudent(id){
  const s=db.students.find(x=>x.id===id);
  if(s.status==='graduated'){toast('该学员已毕业');return}
  const i=GRADES.indexOf(s.grade);
  if(i>=GRADES.length-1){
    if(!confirm(s.name+' 已是最高年段（高三），学年结束通常标记为毕业。确定？'))return;
    s.status='graduated';save();closeModal();renderPage();toast(s.name+' 已标记毕业，历史记录保留在档案中');
  }else{
    const to=GRADES[i+1];
    const cross=s.grade==='初三'&&to==='高一';
    if(!confirm('将 '+s.name+' 从 '+s.grade+' 升入 '+to+'？'+(cross?'\n（初升高：学校将清空，升入后请重新填写学校）':'')+'\n（班级归属不变，如需换班请编辑学员）'))return;
    s.grade=to;
    if(cross)s.school='';
    save();closeModal();renderPage();
    toast(s.name+' 已升入 '+to+(cross?'，学校已清空请重新填写':''));
  }
}
function promoteClass(id){
  const c=db.classes.find(x=>x.id===id);
  const list=db.students.filter(s=>s.classId===id&&s.status==='active');
  if(!list.length){toast('该班没有在读学员');return}
  const top=list.filter(s=>s.grade==='高三').length;
  const up=list.length-top;
  const msg='学年升级：将为「'+c.grade+c.name+'」的 '+up+' 名学员升入下一年段'+(top?('，并将 '+top+' 名高三学员标记为毕业'):'')+'。\n（班级归属不变，如需换班请编辑学员）确定？';
  if(!confirm(msg))return;
  list.forEach(s=>{
    const i=GRADES.indexOf(s.grade);
    if(i>=GRADES.length-1)s.status='graduated';
    else{
      const to=GRADES[i+1];
      if(s.grade==='初三'&&to==='高一')s.school='';
      s.grade=to;
    }
  });
  save();renderPage();toast('学年升级完成（初升高学员的学校已清空，请重新填写）');
}

/* 学员个人档案 */
function openArchive(id){
  const s=db.students.find(x=>x.id===id);
  let present=0,videoN=0,leaveN=0;
  db.lessons.forEach(l=>{
    const a=(l.attendance||{})[s.id];
    if(a==='present')present++;else if(a==='video')videoN++;else if(a==='leave'||a==='absent')leaveN++;
  });
  const hist=db.feedbacks.filter(f=>(f.perStudent||{})[s.id]).sort((a,b)=>b.date.localeCompare(a.date));
  const mkByY={},mkAsX={};
  db.lessons.forEach(function(l){if(l.makeup&&l.makeup[s.id]){const y=db.lessons.find(t=>t.id===l.makeup[s.id]);if(y){mkByY[y.id]={x:l};mkAsX[l.id]=1}}});
  const groups={};
  db.lessons.filter(l=>l.courseId&&l.status!=='cancelled').forEach(l=>{
    const c=courseOf(l);
    if(!c)return;
    const inClass=(c.classIds||[]).includes(s.classId);
    const hasRec=(l.attendance||{})[s.id]!==undefined&&!mkAsX[l.id];
    if(!inClass&&!hasRec)return;
    (groups[c.id]=groups[c.id]||{c:c,inClass:inClass,ls:[]}).ls.push(l);
  });
  const attHTML=Object.values(groups).sort((a,b)=>b.c.startDate.localeCompare(a.c.startDate)).map(g=>{
    const s0=SEASONS[g.c.season];
    const ls=g.ls.slice().sort((a,b)=>a.date.localeCompare(b.date)||a.start.localeCompare(b.start));
    let p=0,v=0,lv=0,tr=0;
    const cells=ls.map(l=>{
      const st=(l.attendance||{})[s.id];
      const ti=dateCN(l.date)+' '+l.start;
      const mkr=mkByY[l.id];
      if(mkr&&(st===undefined||st==='leave'||st==='absent')){p++;return '<span class="att-cell att-c-makeup" title="'+ti+' 补课：'+dateCN(mkr.x.date)+' 在 '+esc(clsNameById(mkr.x.classId))+' 补上">补</span>'}
      if(st==='present'){p++;return '<span class="att-cell att-c-present" title="'+ti+' 出勤">√</span>'}
      if(st==='video'){v++;return '<span class="att-cell att-c-video" title="'+ti+' 补视频录课">视</span>'}
      if(st==='leave'||st==='absent'){lv++;return '<span class="att-cell att-c-leave" title="'+ti+' 请假">假</span>'}
      if(st==='trial'){tr++;return '<span class="att-cell att-c-trial" title="'+ti+' 试听（不计费）">试</span>'}
      if(lessonDone(l))return '<span class="att-cell att-c-none" title="'+ti+' 未记录考勤">'+(g.inClass?'？':'·')+'</span>';
      return '<span class="att-cell att-c-future" title="'+ti+' 未上课">·</span>';
    }).join('');
    return '<div class="arc-g"><div class="arc-g-h">'+s0.icon+' '+esc(g.c.name)+(g.inClass?'':'<span class="badge b-blue">临时</span>')+'<span class="sub">出勤 '+p+' · 录课 '+v+' · 请假 '+lv+(tr?' · 试听 '+tr:'')+'</span></div><div>'+cells+'</div></div>';
  }).join('');
  const histHTML=hist.map(f=>
    '<div class="item"><b>'+dateCN(f.date)+'（周'+WD_CN[parseDate(f.date).getDay()]+'）'+esc(clsNameById(f.classId))+'</b>'
    +(f.topic?'<div class="sub">课题：'+esc(f.topic)+'</div>':'')
    +'<div style="margin-top:2px">'+esc(f.perStudent[s.id])+'</div></div>').join('');
  showModal('学员档案 · '+s.name,
    '<div><b style="font-size:16px">'+esc(s.name)+'</b> '+stuBadge(s)
    +(s.status!=='graduated'?'<button class="btn btn-sm" style="margin-left:8px" onclick="promoteStudent(\''+s.id+'\')">'+(s.grade==='高三'?'🎓 标记毕业':'⬆ 升入下一年段')+'</button>':'')
    +'<button class="btn btn-sm" style="margin-left:8px" onclick="openRedoSheet(\''+s.id+'\')">📝 错题重做卷</button>'
    +'<button class="btn btn-sm" style="margin-left:8px" onclick="openMonthReport(\''+s.id+'\')">📄 月度报告</button></div>'
    +'<div class="sub" style="margin-top:4px">'+esc(s.grade)+(s.cohort?('（'+s.cohort+'届）'):'')+' · '+esc(clsNameById(s.classId))+(s.school?' · '+esc(s.school):'')+(s.relation?' · 家长关系：'+esc(s.relation):'')
    +(s.phone?' · <a href="tel:'+esc(s.phone)+'">'+esc(s.phone)+'</a>':'')+(s.joinedAt?' · 加入于 '+dateCN(s.joinedAt):'')+'</div>'
    +(s.trial?'<div class="sub" style="margin-top:2px">👂 试听记录：'+(function(){const tc=db.courses.find(x=>x.id===s.trial.courseId);return (tc?esc(tc.name+' · '+courseClassNames(tc)):'—')+(s.joinedAt?'（'+dateCN(s.joinedAt)+' 起）':'')+' · '+(s.status==='trial'?'试听中':(s.trial.result==='enrolled'?'已报名':'未报名'))})()+'</div>':'')
    +(s.notes?'<div class="sub" style="margin-top:2px">备注：'+esc(s.notes)+'</div>':'')
    +'<div class="arc-sec"><h4>考勤记录 <span class="sub">（√与视均为计费课时，假不计费）</span></h4>'
    +((present||videoN||leaveN)?'<div style="margin-bottom:6px"><span class="badge b-green" style="margin-right:6px">√ 出勤 '+present+'</span><span class="badge" style="background:#eff6ff;color:#1d4ed8;margin-right:6px">视 录课 '+videoN+'</span><span class="badge b-red">假 请假 '+leaveN+'</span></div>':'')
    +(attHTML||'<span class="sub">还没有考勤记录</span>')

    +'<div class="arc-sec"><h4>历史反馈点评（'+hist.length+'）</h4>'
    +(hist.length?'<div class="panel" style="padding:0 12px">'+histHTML+'</div>':'<span class="sub">还没有写过的点评</span>')+'</div>');
}

function billStatsHTML(from,to,label){
  const ls=db.lessons.filter(l=>l.date>=from&&l.date<=to&&l.status!=='cancelled');
  let bill=0,done=0,noAtt=0;
  ls.forEach(l=>{

    +'</div>';

function statsOf(from,to){
  const ls=db.lessons.filter(l=>l.date>=from&&l.date<=to&&l.status!=='cancelled');
  const sids=new Set();let head=0;
  ls.forEach(l=>{
    const c=courseOf(l);
    const ids=(c&&c.classIds&&c.classIds.length)?c.classIds:(l.classId?[l.classId]:[]);
    const roster=db.students.filter(s=>ids.includes(s.classId)&&s.status==='active');
    const att=l.attendance||{};
    let cnt=0,has=false;
    Object.keys(att).forEach(sid=>{const v=att[sid];if(v==='present'||v==='video'){sids.add(sid);cnt++;has=true}});
    if(!has)roster.forEach(s=>sids.add(s.id));
    head+=has?cnt:roster.length;
  });
  return{lessons:ls.length,students:sids.size,head};
}

function addCourseLesson(id){
  const c=db.courses.find(x=>x.id===id);
  const mainClass=(c.classIds&&c.classIds[0])||c.classId;
  const ls=db.lessons.filter(l=>l.courseId===id&&l.status!=='cancelled').sort((a,b)=>b.date.localeCompare(a.date));
  let d=ls.length?addDays(parseDate(ls[0].date),1):parseDate(c.startDate);
  if(isDailySeason(c.season)){
    const rest=c.restDays||[];
    let guard=0;
    while(guard++<500){
      const date=fmtDate(d);
      if(rest.indexOf(date)<0&&!db.lessons.some(l=>l.date===date&&l.start===c.slotStart&&l.classId===mainClass))break;
      d=addDays(d,1);
    }
  }else{
    while((d.getDay()+6)%7!==c.slotDow)d=addDays(d,1);
    while(db.lessons.some(l=>l.date===fmtDate(d)&&l.start===c.slotStart&&l.classId===mainClass))d=addDays(d,7);
  }
  db.lessons.push({id:uid(),date:fmtDate(d),start:c.slotStart,end:c.slotEnd,classId:mainClass,room:c.slotRoom,topic:'',status:'normal',courseId:id});
  save();openCourseMgr();renderPage();toast('已在 '+fmtDate(d)+' 补 1 节');
}

function renderAttRows(){
  const l=db.lessons.find(x=>x.id===curAttLesson);
  const c=courseOf(l);
  const roster=lessonRoster(l);
  const merged=Object.assign({},l.attendance||{},collectAtt());
  const knownIds={};roster.forEach(s=>{knownIds[s.id]=1});
  const hist=Object.keys(l.attendance||{}).filter(id=>!knownIds[id]&&!attExtra.some(e=>e.id===id)).map(id=>{const st=db.students.find(x=>x.id===id);return st?{id:st.id,name:st.name+'（临时）',status:'active'}:null}).filter(Boolean);
  const rows=roster.concat(attExtra.map(e=>({id:e.id,name:e.name+'（临时）',status:'active',tmp:1})),hist);
  $('#att-rows').innerHTML=rows.map(s=>{
    const cur=merged[s.id]||'';
    const isTrial=s.status==='trial'&&s.trial&&c&&s.trial.courseId===c.id;
    const showTrial=isTrial||cur==='trial';
    const states=showTrial?[['present','√'],['video','视'],['leave','假'],['trial','试']]:[['present','√'],['video','视'],['leave','假']];
    let mkSel='';
    if(s.tmp){

      if(mo){

        mkSel='<select class="mk-sel" data-s="'+s.id+'" title="这次补课对应他正常课程的哪一节（默认按课次序号自动对应，可改）">'
          +'<option value="">不关联</option>'
          +mo.ls.map(t=>{const q=courseSeq(t);return '<option value="'+t.id+'"'+(val===t.id?' selected':'')+'>'+(q?('第'+q.no+'节 · '):'')+dateCN(t.date)+'</option>'}).join('')
          +'</select>';
      }
    }
    return '<div class="att-row"><span class="att-name">'+esc(s.name)
      +(isTrial?'<span class="badge b-blue">试听</span>':'')
      +(!isTrial&&s.status!=='active'?'<span class="badge b-gray">停课</span>':'')+'</span>'
      +mkSel
      +'<span class="att-btns">'

function makeupOptionsFor(sid,X){
  const s=db.students.find(x=>x.id===sid);
  if(!s||!s.classId)return null;
  const cs=db.courses.filter(c=>(c.classIds||[]).includes(s.classId)&&(!X||c.id!==X.courseId)&&c.startDate<=todayStr()&&db.lessons.some(l=>l.courseId===c.id&&l.status!=='cancelled'&&l.date>=todayStr()));
  if(!cs.length)return null;
  const ls=[];
  cs.forEach(function(c){db.lessons.filter(l=>l.courseId===c.id&&l.status!=='cancelled').forEach(l=>ls.push(l))});
  ls.sort((a,b)=>a.date.localeCompare(b.date)||a.start.localeCompare(b.start));
  if(!ls.length)return null;
  const cur=X.makeup&&X.makeup[sid]?X.makeup[sid]:'';
  let def=cur;
  if(!def){
    const seqX=courseSeq(X);
    if(seqX){const t=ls.find(l=>{const q=courseSeq(l);return q&&q.no===seqX.no});if(t)def=t.id}
  }
  return{ls:ls,def:def,cur:cur};
}
function saveAttendance(id){
  const l=db.lessons.find(x=>x.id===id);

  document.querySelectorAll('#modal-root .att-btns').forEach(g=>{
    const on=g.querySelector('.att-btn.on-present,.att-btn.on-video,.att-btn.on-leave,.att-btn.on-trial');
    if(on)att[on.dataset.s]=on.dataset.v;
  });
  if(Object.keys(att).length)l.attendance=att;else delete l.attendance;
  const mk={};
  document.querySelectorAll('#modal-root .mk-sel').forEach(function(sel){if(sel.value)mk[sel.dataset.s]=sel.value});
  if(Object.keys(mk).length)l.makeup=mk;else delete l.makeup;
  save();closeModal();renderPage();toast('考勤已保存');
}

function buildFullText(fb){

  if(fb.content)L.push('课堂内容：'+fb.content);
  if(fb.homework)L.push('课后作业：'+fb.homework);
  if(fb.notes)L.push('整体表现：'+fb.notes);

function buildStudentText(fb,stu){
  const L=['【物理课后反馈】'+fbHead(fb),'学员：'+stu.name+(stu.relation?'（'+stu.relation+'）':'')];
  if(fb.topic)L.push('课题：'+fb.topic);
  if(fb.content)L.push('课堂内容：'+fb.content);
  if(fb.homework)L.push('课后作业：'+fb.homework);
  const hw=(fb.hwStatus||{})[stu.id];
  if(hw)L.push('上次作业完成情况：'+hw);
  const gr=(fb.fbGrade||{})[stu.id]||'';
  const wr=(fb.fbWrong||{})[stu.id];
  if(gr||wr){
    const parts=[];
    if(gr)parts.push(gr+' 等级');
    if(wr==='absent')parts.push('缺考');
    else if(wr&&wr.length)parts.push('错题 '+wr.join('、')+' 题');
    L.push('课堂检测：'+(parts.join(' · ')||'未测'));
  }
  const t=(fb.perStudent||{})[stu.id];
  if(t)L.push('课堂表现：'+t);
  if(fb.nextContent)L.push('下次课程内容：'+fb.nextContent);
  return L.join('\n');

function generateHolidayLessons(){
  const a=document.getElementById('hd-start').value,b=document.getElementById('hd-end').value;
  if(!a||!b){toast('请选择日期范围');return}
  if(b<a){toast('结束日期需不早于开始日期');return}
  if((parseDate(b)-parseDate(a))/86400000>60){toast('范围过大，请控制在 60 天内');return}
  const ids=[].slice.call(document.querySelectorAll('input[name=hdCourse]:checked')).map(function(x){return x.value});
  if(!ids.length){toast('请勾选要连排的班级');return}
  let added=0,skipped=0;
  let d=parseDate(a),end=parseDate(b),guard=0;
  while(d<=end&&guard++<400){
    const date=fmtDate(d);
    ids.forEach(function(id){
      const c=db.courses.find(function(x){return x.id===id});
      if(!c)return;
      const mainClass=(c.classIds&&c.classIds[0])||c.classId;
      if(db.lessons.some(function(l){return l.date===date&&l.start===c.slotStart&&l.classId===mainClass})){skipped++;return}
      db.lessons.push({id:uid(),date:date,start:c.slotStart,end:c.slotEnd,classId:mainClass,room:c.slotRoom,topic:'',status:'normal',courseId:c.id});
      added++;
    });
    d=addDays(d,1);
  }
  save();renderPage();
  if(document.getElementById('mv-list'))moverLoad(moverDate);
  toast('已连排 '+added+' 节（'+a+' 至 '+b+'）'+(skipped?('，跳过 '+skipped+' 节已有课'):'')+'；可继续清空或微调');
}

function extractQFromDoc(docText,no){
  if(!docText)return '';
  const lines=String(docText).split('\n');
  const start=new RegExp('^\\s*'+no+'\\s*[.．、]\\s*');
  const anyNo=new RegExp('^\\s*\\d+\\s*[.．、]\\s*');
  let on=false;const buf=[];
  for(let i=0;i<lines.length;i++){
    const ln=lines[i];
    if(!on){if(start.test(ln)){on=true;const t0=ln.replace(start,'').trim();if(t0)buf.push(t0)}}
    else{if(anyNo.test(ln))break;const t1=ln.trim();if(t1)buf.push(t1)}
  }
  return buf.join(' ').slice(0,400);
}
let redoSheetN=5;
function redoSheetText(s){
  const qs=db.quizzes.filter(q=>q.results&&q.results[s.id]&&(q.results[s.id].wrong||[]).length)
    .sort((a,b)=>b.date.localeCompare(a.date));
  const n=redoSheetN||0;
  const range=n>0?qs.slice(0,n):qs;
  const total=range.reduce((a,q)=>a+(q.results[s.id].wrong||[]).length,0);
  const L=['【错题重做 · '+s.name+'】'+(range.length?('共 '+range.length+' 次小测 · '+total+' 道错题'):'暂无错题记录')];
  range.forEach(function(q){
    const pm={};(q.points||[]).forEach(p=>{pm[p.no]=p});
    L.push('','▎'+dateCN(q.date)+' '+(q.name||'小测')+'（'+clsNameById(q.classId)+'）');
    (q.results[s.id].wrong||[]).slice().sort((a,b)=>a-b).forEach(function(no){
      const p=pm[no];
      const ex=extractQFromDoc(q.docText,no);
      L.push('第'+no+'题'+(p?(' '+p.point+(p.detail?'（'+p.detail+'）':'')):'')+(ex?('\n    '+ex):''));
    });
  });
  return L.join('\n');
}

function openQuizRedo(id){
  const q=db.quizzes.find(x=>x.id===id);
  const cnt={},names={};
  Object.keys(q.results||{}).forEach(function(sid){
    const r=q.results[sid];
    if(r.absent)return;
    (r.wrong||[]).forEach(function(no){
      cnt[no]=(cnt[no]||0)+1;
      (names[no]=names[no]||[]).push(sid);
    });
  });
  const nos=Object.keys(cnt).map(Number).sort((a,b)=>cnt[b]-cnt[a]);
  const pm={};(q.points||[]).forEach(p=>{pm[p.no]=p});
  const L=['【全班重做 · '+dateCN(q.date)+' '+(q.name||'小测')+'】'+clsNameById(q.classId),'（按错误人数排序；共 '+nos.length+' 道题有人做错）'];
  nos.forEach(function(no){
    const p=pm[no];
    const ex=extractQFromDoc(q.docText,no);
    const who=names[no].map(sid=>{const st=db.students.find(x=>x.id===sid);return st?st.name:'?'});
    L.push('','第'+no+'题'+(p?(' '+p.point):'')+' —— '+cnt[no]+' 人错（'+who.join('、')+'）'+(ex?('\n    '+ex):''));
  });

    +'<div class="psb">'+esc(L.join('\n'))+'</div>'
    +'<div class="m-actions"><button type="button" class="btn" onclick="copyText(document.querySelector(\'#modal-root .psb\').textContent)">📋 复制全部</button><button class="btn btn-primary" onclick="closeModal()">关闭</button></div>');
}
let kpStatsView='kp',kpStatsClass='',kpStatsStu='';

function renderKpStatsModal(){
  const v=kpStatsView;
  let bodyHTML='';
  if(v==='kp'){
    const agg={};
    db.quizzes.forEach(function(q){
      if(kpStatsClass&&q.classId!==kpStatsClass)return;
      const r=q.results||{};
      const sids=Object.keys(r).filter(sid=>!r[sid].absent);
      if(!sids.length)return;
      (q.points||[]).forEach(function(p){
        const key=p.point||('第'+p.no+'题');
        const a=agg[key]=agg[key]||{err:0,part:0,times:0,wrongWho:{}};
        a.times++;
        sids.forEach(function(sid){
          a.part++;
          if((r[sid].wrong||[]).indexOf(p.no)>=0){a.err++;a.wrongWho[sid]=(a.wrongWho[sid]||0)+1}
        });
      });
    });
    const keys=Object.keys(agg).sort((a,b)=>(agg[b].err/(agg[b].part||1))-(agg[a].err/(agg[a].part||1))||agg[b].err-agg[a].err);
    bodyHTML=keys.length?keys.map(function(k){
      const a=agg[k];
      const rate=a.part?Math.round(a.err/a.part*100):0;
      const who=Object.keys(a.wrongWho).sort((x,y)=>a.wrongWho[y]-a.wrongWho[x]).map(sid=>{const st=db.students.find(x=>x.id===sid);return (st?st.name:'?')+'×'+a.wrongWho[sid]}).join('、');
      return '<details class="kp-row"><summary><b>'+esc(k)+'</b><span class="badge '+(rate>=50?'b-red':(rate>=25?'b-amber':'b-gray'))+'">错 '+a.err+' / 考 '+a.part+'（'+rate+'%）</span><span class="sub">出现 '+a.times+' 次</span></summary><div class="sub" style="padding:4px 2px">错过的学员：'+esc(who)+'</div></details>';
    }).join(''):'<p class="sub">还没有考点数据（需要小测已分析考点并录入错题）。</p>';
  }else{
    const stuOpts=db.students.filter(x=>x.status!=='graduated'&&x.status!=='trialed').sort((a,b)=>GRADES.indexOf(a.grade)-GRADES.indexOf(b.grade)).map(x=>'<option value="'+x.id+'"'+(kpStatsStu===x.id?' selected':'')+'>'+esc(x.name)+'</option>').join('');
    let detailHTML='<p class="sub">选择学员查看他的薄弱考点。</p>';
    if(kpStatsStu){
      const cnt={};
      db.quizzes.forEach(function(q){
        if(kpStatsClass&&q.classId!==kpStatsClass)return;
        const r=(q.results||{})[kpStatsStu];
        if(!r||r.absent)return;
        (r.wrong||[]).forEach(function(no){
          const p=(q.points||[]).filter(x=>x.no===no)[0];
          const key=p?p.point:('第'+no+'题');
          cnt[key]=(cnt[key]||0)+1;
        });
      });
      const ks=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a]);
      detailHTML=ks.length?('<div>'+ks.map(k=>'<div class="item"><div style="display:flex;justify-content:space-between;gap:8px;align-items:center"><b>'+esc(k)+'</b><span class="badge b-amber">错 '+cnt[k]+' 次</span></div></div>').join('')+'</div>'):'<p class="sub">该学员暂无错题记录。</p>';
    }
    bodyHTML='<div class="toolbar" style="margin-bottom:8px"><select onchange="kpStatsStu=this.value;renderKpStatsModal()"><option value="">选择学员…</option>'+stuOpts+'</select></div>'+detailHTML;
  }
  showModal('考点统计',
    '<div class="toolbar" style="margin-bottom:10px">'
    +'<div class="seg"><button class="'+(v==='kp'?'on':'')+'" onclick="kpStatsView=\'kp\';renderKpStatsModal()">按考点</button><button class="'+(v==='stu'?'on':'')+'" onclick="kpStatsView=\'stu\';renderKpStatsModal()">按学员</button></div>'
    +'<select onchange="kpStatsClass=this.value;renderKpStatsModal()"><option value="">全部班级</option>'+db.classes.map(c=>'<option value="'+c.id+'"'+(kpStatsClass===c.id?' selected':'')+'>'+esc(c.grade+c.name)+'</option>').join('')+'</select>'
    +'</div>'+bodyHTML
    +'<div class="m-actions"><button type="button" class="btn btn-primary" onclick="closeModal()">关闭</button></div>',null,{large:true});

    +'<button class="btn" onclick="openQuizRedo(\''+id+'\')">🖨 全班错题卷</button>'
    +'</div>'
    +'<div class="fi"><label>题目文字（可编辑，AI 分析考点用；没有上传文档时在这里粘贴）</label>'
    +'<textarea id="qz-text" style="min-height:90px">'+esc(q.docText||'')+'</textarea></div>'
    +'<div class="fi"><label>每题考点（可编辑，一行一题；格式：题号. 考点 | 说明）</label>'
    +'<textarea id="qz-points" style="min-height:130px">'+esc(pts.map(p=>p.no+'. '+p.point+(p.detail?' | '+p.detail:'')).join('\n'))+'</textarea></div>'
    +'<div class="m-actions"><button type="button" class="btn" onclick="saveQuizPoints(\''+id+'\')">保存考点修改</button><span style="flex:1"></span>'
    +'<button class="btn btn-primary" onclick="closeModal()">关闭</button></div>');
}
function saveQuizPoints(id){
  const q=db.quizzes.find(x=>x.id===id);
  if($('#qz-text'))q.docText=$('#qz-text').value.trim();
  const lines=$('#qz-points').value.split('\n').map(l=>l.trim()).filter(Boolean);
  q.points=lines.map(function(l,i){
    const m=l.match(/^(\d+)[.、\s]+(.+)$/);
    let no=m?+m[1]:(i+1),rest=m?m[2]:l,point=rest,detail='';
    const sep=rest.indexOf(' | ');
    if(sep>=0){point=rest.slice(0,sep).trim();detail=rest.slice(sep+3).trim()}
    return{no:no,point:point,detail:detail};
  });
  save();renderPage();toast('考点已保存（'+q.points.length+' 题）');
}
let qzEntryCur={};
let curQuizId='';
function openQuizEntry(id){
  const q=db.quizzes.find(x=>x.id===id);
  curQuizId=id;
  qzEntryCur=JSON.parse(JSON.stringify(q.results||{}));
  let maxNo=(q.points||[]).length?Math.max.apply(null,(q.points||[]).map(p=>p.no)):0;
  Object.keys(qzEntryCur).forEach(function(sid){(qzEntryCur[sid].wrong||[]).forEach(function(w){if(w>maxNo)maxNo=w})});
  if(!maxNo)maxNo=10;
  showModal('错题录入 · '+dateCN(q.date)+' '+esc(q.name),
    '<p class="sub" style="margin-bottom:8px">点题号标记错题（再点取消），或在右侧输入题号后回车；请假学生点「缺考」。</p>'
    +'<div class="toolbar" style="margin-bottom:8px"><span class="sub">题目总数：</span><input id="qz-total" type="number" min="1" value="'+maxNo+'" style="width:72px;padding:4px 8px;border:1px solid var(--border);border-radius:8px" onchange="renderQuizEntry(\''+id+'\')"></div>'
    +'<div id="qz-entry-rows"></div>'
    +'<div class="m-actions"><button type="button" class="btn" onclick="closeModal()">取消</button><button class="btn btn-primary" onclick="saveQuizEntry(\''+id+'\')">保存错题</button></div>');
  renderQuizEntry(id);
}
function renderQuizEntry(id){
  const q=db.quizzes.find(x=>x.id===id);
  const roster=db.students.filter(s=>s.classId===q.classId&&s.status!=='graduated');
  const N=+($('#qz-total')?$('#qz-total').value:10)||10;
  $('#qz-entry-rows').innerHTML=roster.map(function(s){
    const r=qzEntryCur[s.id]||{};
    const absent=!!r.absent;
    const wrong=r.wrong||[];
    let nums='';
    for(let i=1;i<=N;i++){
      nums+='<button class="num-btn'+(wrong.indexOf(i)>=0?' on':'')+(absent?' dis':'')+'" data-sid="'+s.id+'" data-no="'+i+'" onclick="toggleWrong(this)">'+i+'</button>';
    }
    return '<div class="qe-row"><div class="qe-name">'+esc(s.name)+'</div>'
      +'<div class="qe-nums">'+nums+'</div>'
      +'<div class="qe-side"><button class="btn-sm btn'+(absent?' btn-primary':'')+'" onclick="toggleAbsent(\''+s.id+'\')">'+(absent?'缺考✓':'缺考')+'</button>'
      +'<input class="qe-input" placeholder="题号如 1,3,5" value="'+esc(wrong.join(','))+'"></div>'
      +'</div>';
  }).join('')||'<p class="sub">该班级暂无学员</p>';
  // 绑定文本框
  $('#qz-entry-rows').querySelectorAll('.qe-input').forEach(function(inp,i){
    inp.addEventListener('change',function(){
      const row=inp.closest('.qe-row');
      const sid=row.querySelector('.num-btn').dataset.sid;
      setWrongByText(sid,inp.value);
    });
  });
}
function toggleWrong(btn){
  if(btn.classList.contains('dis'))return;
  const sid=btn.dataset.sid,no=+btn.dataset.no;
  qzEntryCur[sid]=qzEntryCur[sid]||{wrong:[],absent:false};
  const arr=qzEntryCur[sid].wrong;
  const i=arr.indexOf(no);
  if(i>=0)arr.splice(i,1);else arr.push(no);
  arr.sort(function(a,b){return a-b});
  btn.classList.toggle('on');
}
function toggleAbsent(sid){
  qzEntryCur[sid]=qzEntryCur[sid]||{wrong:[],absent:false};
  qzEntryCur[sid].absent=!qzEntryCur[sid].absent;
  if(qzEntryCur[sid].absent)qzEntryCur[sid].wrong=[];
  renderQuizEntry(curQuizId);
}
function setWrongByText(sid,val){
  const arr=String(val).split(/[,，、\s]+/).map(function(x){return parseInt(x,10)}).filter(function(n){return n>0});
  qzEntryCur[sid]=qzEntryCur[sid]||{wrong:[],absent:false};
  qzEntryCur[sid].wrong=arr.sort(function(a,b){return a-b});
  renderQuizEntry(curQuizId);
}
function saveQuizEntry(id){
  const q=db.quizzes.find(x=>x.id===id);
  q.results={};
  Object.keys(qzEntryCur).forEach(function(sid){
    const r=qzEntryCur[sid];
    if(r&&((r.wrong&&r.wrong.length)||r.absent))q.results[sid]={wrong:(r.wrong||[]).slice().sort(function(a,b){return a-b}),absent:!!r.absent};
  });
  save();closeModal();renderPage();toast('错题已保存（'+Object.keys(q.results).length+' 人）');
}
function openQuizGen(id){
  const q=db.quizzes.find(x=>x.id===id);
  if(!q.points||!q.points.length){toast('请先分析或录入考点');openQuizDetail(id);return}
  const resN=Object.keys(q.results||{}).length;
  if(!resN){toast('请先录入错题情况');openQuizEntry(id);return}
  showModal('生成学生分析',
    '<div class="fi"><label>详细度</label><select id="qg-level">'
    +'<option value="brief"'+((q.analysisLevel||'brief')==='brief'?' selected':'')+'>精简（默认，每人 1-2 句）</option>'
    +'<option value="normal"'+(q.analysisLevel==='normal'?' selected':'')+'>标准（每人 3-4 句）</option>'
    +'<option value="full"'+(q.analysisLevel==='full'?' selected':'')+'>详细（每人一段）</option></select></div>'
    +'<p class="sub">学生姓名会以“学生1、学生2”匿名发送给 DeepSeek，返回后自动映射回姓名；生成结果可直接编辑。</p>'
    +'<div id="qg-result"></div>'
    +'<div class="m-actions"><button type="button" class="btn" onclick="closeModal()">关闭</button><button class="btn btn-primary" onclick="runQuizGen(\''+id+'\')">✨ 生成</button></div>');
  renderQuizAnalyses(id);
}
async function runQuizGen(id){
  const q=db.quizzes.find(x=>x.id===id);
  const level=$('#qg-level').value;
  const roster=db.students.filter(s=>s.classId===q.classId&&s.status!=='graduated'&&q.results[s.id]);
  if(!roster.length){toast('没有可分析的学生（请先录错题）');return}
  const am=anonMap(roster);
  const pts=(q.points||[]).map(p=>p.no+'. '+p.point+(p.detail?('（'+p.detail+'）'):'')).join('\n');
  const stuLines=roster.map(function(s){
    const r=q.results[s.id];
    if(r.absent)return am.aliasBySid[s.id]+'：本次请假未参加小测';
    return am.aliasBySid[s.id]+'：错题 '+((r.wrong||[]).join(', ')||'无');
  }).join('\n');
  const lenMap={brief:'每人1-2句话（约40-60字）',normal:'每人3-4句话（约80-120字）',full:'每人5-6句话（约150-200字）'};
  toast('AI 正在生成分析，请稍候…');
  try{
    const content=await callDeepSeek([
      {role:'system',content:'你是一位中学物理老师，为学生家长写课后小测反馈。根据每题考点和每位学生的错题情况，为每位学生写分析：先肯定做得好的地方，再指出需要加强的知识点（结合具体题目考点），最后给一句简短建议。要求：语言自然具体、不说套话、不排名、不比较学生；缺考的学生写一句“本次请假未参加小测，欢迎补做”之类即可。严格控制长度：'+lenMap[level]+'。\n输出 JSON：{"analyses":{"学生1":"……","学生2":"……"}}，键名必须与输入的学生编号完全一致。只输出 JSON。'},
      {role:'user',content:'小测名称：'+q.name+'\n\n每题考点：\n'+pts+'\n\n学生情况：\n'+stuLines}
    ],{json:true});
    const data=parseAIJson(content);
    const an=data.analyses||{};
    q.analyses={};
    roster.forEach(function(s){
      const alias=am.aliasBySid[s.id];
      const txt=an[alias]||'';
      if(txt)q.analyses[s.id]=String(txt).trim();
    });
    q.analysisLevel=level;
    save();
    toast('分析已生成，可编辑后使用');
    renderQuizAnalyses(id);
  }catch(err){toast('生成失败：'+err.message)}
}
function renderQuizAnalyses(id){
  const q=db.quizzes.find(x=>x.id===id);
  const el=$('#qg-result');
  if(!el)return;
  const ks=Object.keys(q.analyses||{});
  if(!ks.length){el.innerHTML='<p class="sub">还没有分析结果。选好详细度后点「✨ 生成」。</p>';return}
  el.innerHTML='<div class="toolbar" style="margin:10px 0 6px"><b style="font-size:14px">分析结果（'+ks.length+' 人）</b><button type="button" class="btn-sm btn" onclick="copyQuizAll(\''+id+'\')">📋 复制全部</button></div>'
    +ks.map(function(sid){
      const s=db.students.find(x=>x.id===sid);
      const absent=q.results[sid]&&q.results[sid].absent;
      return '<div class="ps-item"><div class="ps-name">'+esc(s?s.name:'？')
        +(absent?'<span class="badge b-gray">缺考</span>':'')
        +'<button type="button" class="btn-link" onclick="copyQuizAnalysis(\''+id+'\',\''+sid+'\')">复制发给家长</button></div>'
        +'<textarea class="qg-ta" onchange="updateQuizAnalysis(\''+id+'\',\''+sid+'\',this.value)">'+esc(q.analyses[sid])+'</textarea></div>';
    }).join('');
}
function updateQuizAnalysis(id,sid,val){
  const q=db.quizzes.find(x=>x.id===id);
  q.analyses[sid]=val.trim();
  save();toast('已更新');
}
function copyQuizAnalysis(id,sid){
  const q=db.quizzes.find(x=>x.id===id);
  const s=db.students.find(x=>x.id===sid);
  if(!q.analyses[sid])return;
  copyText('【小测反馈】'+dateCN(q.date)+' '+q.name+'\n'+(s?s.name+'：':'')+q.analyses[sid]);
}
function copyQuizAll(id){
  const q=db.quizzes.find(x=>x.id===id);
  const lines=['【小测反馈】'+dateCN(q.date)+' '+q.name];
  Object.keys(q.analyses||{}).forEach(function(sid){
    const s=db.students.find(x=>x.id===sid);
    lines.push((s?s.name:'？')+'：'+q.analyses[sid]);
  });
  copyText(lines.join('\n\n'));
}

/* ================= 云同步 ================= */
function openCloudSettings(){
  const s=db.settings||{};
  showModal('云同步设置（Supabase）',
    '<p class="sub" style="margin-bottom:10px">在 supabase.com 注册后按指引创建一张表，把三个值填到下面（三台设备填同一套值）。每一步的详细图文指引可向 Proma 助手索取。</p>'
    +'<div class="form">'
    +'<div class="fi"><label>项目网址（Project URL）</label><input id="cs-url" value="'+esc(s.cloudUrl||'')+'" placeholder="https://xxxx.supabase.co"></div>'
    +'<div class="fi"><label>anon public key</label><input id="cs-key" value="'+esc(s.cloudKey||'')+'" placeholder="eyJhbGciOi...（一长串）"></div>'
    +'<div class="fi"><label>同步名称（自定义的私密串，三台设备必须完全一致）</label><input id="cs-id" value="'+esc(s.cloudId||'')+'" placeholder="例如：wang-physics-8f3k2"></div>'
    +'<div class="m-actions"><button type="button" class="btn" onclick="cloudTest()">测试连接</button><span style="flex:1"></span>'
    +'<button type="button" class="btn" onclick="closeModal()">取消</button><button class="btn btn-primary" onclick="saveCloudSettings()">保存</button></div>'
    +'</div>');
}
function saveCloudSettings(){
  db.settings.cloudUrl=$('#cs-url').value.trim().replace(/\/+$/,'');
  db.settings.cloudKey=$('#cs-key').value.trim();
  db.settings.cloudId=$('#cs-id').value.trim();
  save();closeModal();renderPage();toast('云同步设置已保存');
}
async function cloudTest(){
  db.settings.cloudUrl=$('#cs-url').value.trim().replace(/\/+$/,'');
  db.settings.cloudKey=$('#cs-key').value.trim();
  save();
  const s=db.settings;
  if(!s.cloudUrl||!s.cloudKey){toast('请先填写项目网址和 key');return}
  toast('正在测试连接…');
  try{
    const hdr={'apikey':s.cloudKey,'Authorization':'Bearer '+s.cloudKey};
    const res=await fetch(s.cloudUrl+'/rest/v1/ptw_sync?select=id&limit=1',{headers:hdr});
    if(res.status===401||res.status===403)throw new Error('key 不正确');
    if(res.status===404)throw new Error('连接成功，但还没建表（请按指引在 SQL Editor 里执行建表语句）');
    if(!res.ok)throw new Error('HTTP '+res.status);
    const w=await fetch(s.cloudUrl+'/rest/v1/ptw_sync',{method:'POST',headers:Object.assign({'Content-Type':'application/json','Prefer':'resolution=merge-duplicates'},hdr),body:JSON.stringify([{id:'__conn_test__',data:{t:1},updated_at:new Date().toISOString()}])});
    if(!w.ok){
      let m='HTTP '+w.status;try{const j=await w.json();if(j.message)m=j.message}catch(e2){}
      if(String(m).indexOf('row-level security')>=0){showRlsFix();return}
      throw new Error(m);
    }
    await fetch(s.cloudUrl+'/rest/v1/ptw_sync?id=eq.__conn_test__',{method:'DELETE',headers:hdr});
    toast('连接成功（读写正常），可以开始同步了');
  }catch(e){toast('连接失败：'+e.message)}
}
function showRlsFix(){
  prompt('云端表权限（RLS）未配置：读得了、写不进去。\n\n请到 Supabase → SQL Editor 执行下面这段 SQL，然后重试（在弹窗里复制）：','create policy "ptw_sync_all" on ptw_sync for all to anon using (true) with check (true);');
}
async function cloudUpload(){
  const s=db.settings;
  if(!s.cloudUrl||!s.cloudKey||!s.cloudId){toast('请先配置云同步');openCloudSettings();return}
  toast('正在上传…');
  try{
    const res=await fetch(s.cloudUrl+'/rest/v1/ptw_sync',{
      method:'POST',
      headers:{'apikey':s.cloudKey,'Authorization':'Bearer '+s.cloudKey,'Content-Type':'application/json','Prefer':'resolution=merge-duplicates'},
      body:JSON.stringify([{id:s.cloudId,data:JSON.parse(JSON.stringify(db)),updated_at:new Date().toISOString()}])
    });
    if(!res.ok){
      let m='HTTP '+res.status;try{const j=await res.json();if(j.message)m=j.message}catch(e2){}
      if(String(m).indexOf('row-level security')>=0){showRlsFix();return}
      throw new Error(m);
    }
    db.settings.lastSyncAt=Date.now();db.settings.lastSyncDir='上传';
    save();renderPage();
    toast('已上传到云，其他设备点「从云下载」即可获取');
  }catch(e){toast('上传失败：'+e.message)}
}
async function cloudDownload(){
  const s=db.settings;
  if(!s.cloudUrl||!s.cloudKey||!s.cloudId){toast('请先配置云同步');openCloudSettings();return}
  toast('正在读取云端数据…');
  try{
    const res=await fetch(s.cloudUrl+'/rest/v1/ptw_sync?id=eq.'+encodeURIComponent(s.cloudId)+'&select=*',{headers:{'apikey':s.cloudKey,'Authorization':'Bearer '+s.cloudKey}});
    if(!res.ok){let m='HTTP '+res.status;try{const j=await res.json();if(j.message)m=j.message}catch(e2){};throw new Error(m)}
    const arr=await res.json();
    if(!arr.length){toast('云端还没有数据，请先在某台设备上点「上传到云」');return}
    const cd=arr[0];
    const ut=cd.updated_at?new Date(cd.updated_at):null;
    const uts=ut?((ut.getMonth()+1)+'月'+ut.getDate()+'日 '+String(ut.getHours()).padStart(2,'0')+':'+String(ut.getMinutes()).padStart(2,'0')):'未知时间';
    if(!confirm('云端数据更新时间：'+uts+'\n下载将覆盖本机的全部数据，确定继续？'))return;
    const keep={cloudUrl:s.cloudUrl,cloudKey:s.cloudKey,cloudId:s.cloudId};
    db=migrate(cd.data);
    db.settings=Object.assign({},db.settings||{},keep);
    const now=Date.now();
    db.settings.lastSyncAt=now;db.settings.lastSyncDir='下载';
    save();renderPage();
    toast('已从云下载并覆盖本机数据');
  }catch(e){toast('下载失败：'+e.message)}
}

/* ================= 数据备份 ================= */
async function exportData(){
  const json=JSON.stringify(db,null,2);
  const fname='教师工作台备份_'+todayStr().replace(/-/g,'')+'.json';
  // 优先：另存为对话框，用户首次选择 D:\教师工作台 后，系统以后默认停在该文件夹
  try{
    if(window.showSaveFilePicker){
      const h=await showSaveFilePicker({suggestedName:fname,types:[{description:'JSON 备份文件',accept:{'application/json':['.json']}}]});
      const w=await h.createWritable();await w.write(json);await w.close();
      toast('备份已保存：'+h.name);
      return;
    }
  }catch(e){if(e&&e.name==='AbortError')return}
  // 降级：保存到浏览器默认下载文件夹
  const blob=new Blob([json],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=fname;
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),3000);
  toast('备份已导出到下载文件夹');
}
function importData(input){
  const file=input.files[0];
  input.value='';
  if(!file)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const d=JSON.parse(r.result);
      if(!d||!Array.isArray(d.students)||!Array.isArray(d.lessons)){toast('文件格式不正确');return}
      if(!confirm('导入将覆盖当前全部数据，确定继续？'))return;
      db=migrate(d);db.isDemo=false;
      save();closeModal();renderPage();
      toast('导入成功');
    }catch(err){toast('文件解析失败：'+err.message)}
  };
  r.readAsText(file);
}
function resetData(){
  if(!confirm('确定清空全部数据？建议先导出备份，此操作不可恢复。'))return;
  db=emptyDb();
  save();closeModal();renderPage();
  toast('已清空，开始建立你的工作台吧');
}

/* ================= 启动 ================= */
function checkOrphanLessons(){
  if(db.lessons.length&&!db.courses.length){
    setTimeout(function(){
      if(confirm('检测到课表中有 '+db.lessons.length+' 节无归属的课次（可能是之前删除课程期时的残留）。\n\n是否现在清理它们？其他数据不受影响。')){
        const n=db.lessons.length;
        db.lessons=[];
        save();renderPage();
        toast('已清理残留的 '+n+' 节课次');
      }
    },800);
  }
}
db=load();
renderPage();
checkOrphanLessons();
